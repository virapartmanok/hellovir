<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1a22">
<title>Vir Apartmanok – Hamarosan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚧%3C/text%3E%3C/svg%3E">
<style>html,body{margin:0;background:#070f14}</style>
</head>
<body>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fraunces:wght@600&family=Plus+Jakarta+Sans:wght@400;700&display=swap");
#vir{position:relative;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:48px 20px;color:#eaf2f5;text-align:center;font:16px/1.6 "Plus Jakarta Sans",system-ui,sans-serif;background:radial-gradient(ellipse at 50% 0%,#12394d 0,#0b1a22 55%,#070f14 100%)}
#vir *{box-sizing:border-box}
#vir input.l{position:absolute;opacity:0;width:0;height:0;padding:0;border:0;pointer-events:none}
#vir .box{max-width:640px;width:100%}
#vir .lg{display:flex;gap:8px;justify-content:center;margin-bottom:40px}
#vir .lg label{cursor:pointer;border:1.5px solid #27414d;background:#14252e;color:#eaf2f5;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;display:block}
#vir .ico{font-size:56px;line-height:1.1;animation:vbob 3s ease-in-out infinite}
@keyframes vbob{50%{transform:translateY(-8px)}}
#vir .brand{letter-spacing:.2em;text-transform:uppercase;font-size:13px;color:#3fd0c9;font-weight:700;margin:14px 0 12px}
#vir .h{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:clamp(30px,6vw,52px);line-height:1.15;margin:0 0 14px;color:#fff}
#vir .p{font-size:clamp(17px,2.2vw,21px);color:#9bb3bf;margin:0}
#vir .tx{display:none}
#vir #vl1:checked~.box .t1,#vir #vl2:checked~.box .t2,#vir #vl3:checked~.box .t3,#vir #vl4:checked~.box .t4{display:block}
#vir #vl1:checked~.box label[for=vl1],#vir #vl2:checked~.box label[for=vl2],#vir #vl3:checked~.box label[for=vl3],#vir #vl4:checked~.box label[for=vl4]{background:#59b6e3;border-color:#59b6e3;color:#06222f}
#vir input.l:focus-visible~.box .lg{outline:3px solid #3fd0c9;outline-offset:6px;border-radius:999px}
@media(prefers-reduced-motion:reduce){#vir .ico{animation:none}}
</style>
<div id="vir" lang="hu">
<input class="l" type="radio" name="vl" id="vl1" checked aria-label="Magyar">
<input class="l" type="radio" name="vl" id="vl2" aria-label="English">
<input class="l" type="radio" name="vl" id="vl3" aria-label="Deutsch">
<input class="l" type="radio" name="vl" id="vl4" aria-label="Čeština">
<div class="box">
<div class="lg"><label for="vl1">HU</label><label for="vl2">EN</label><label for="vl3">DE</label><label for="vl4">CS</label></div>
<div class="ico">🚧</div>
<div class="brand">Vir Apartmanok</div>
<div class="tx t1" lang="hu"><div class="h">Hamarosan elérhető lesz a weboldal</div><p class="p">Türelmüket köszönjük!</p></div>
<div class="tx t2" lang="en"><div class="h">Our website will be available soon</div><p class="p">Thank you for your patience.</p></div>
<div class="tx t3" lang="de"><div class="h">Unsere Website ist bald verfügbar</div><p class="p">Vielen Dank für Ihre Geduld.</p></div>
<div class="tx t4" lang="cs"><div class="h">Naše webové stránky budou brzy k dispozici</div><p class="p">Děkujeme za trpělivost.</p></div>
</div>
</div>
</body>
</html>
